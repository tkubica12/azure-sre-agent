[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pulsemart"
version = "0.1.0"
description = "Demo workload for the Azure SRE Agent demonstration (see SPEC.md section 7)."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.13",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "azure-monitor-opentelemetry==1.8.9",
    "python-json-logger==4.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["pulsemart"]

[tool.hatch.build.targets.wheel.force-include]
"pulsemart/templates" = "pulsemart/templates"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
packages = ["pulsemart"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
