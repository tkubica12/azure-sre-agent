# Failure definition and operator metadata for the "bad deployment" incident
# scenario (see AGENTS.md repository layout, SPEC.md sections 5 and 11, and
# PLAN.md Milestone 5). Read by `labctl demo list/prepare/trigger/verify/reset`
# (see labctl/src/labctl/scenario.py); never hand-applied directly.
#
# This is the one demonstration scenario in scope for Milestone 5. Editing
# the tunable numbers below changes `labctl demo` behavior on the next run;
# no code change is required for timing/threshold adjustments.

slug: bad-deployment
title: "Bad deployment: checkout returns HTTP 500"
summary: >-
  A new Container Apps revision ships with a broken checkout dependency
  (DEMO_FAILURE_MODE=checkout-500) and receives 100% of production traffic.
  Checkout requests fail with HTTP 500, Azure Monitor's real metric alert
  fires, the Azure SRE Agent investigates, and its rollback-advisor subagent
  executes a real traffic rollback to the known-good revision itself, under
  its own managed identity, in Autonomous mode (product-owner decision,
  2026-07-30 -- see SPEC.md section 5 Scene 5 and PLAN.md Milestone 5).
  Telemetry and the Activity Log both prove recovery and prove the agent's
  own identity made the change.
estimated_duration_minutes: 15

fault:
  # Environment variables merged into the new revision's container template.
  # Only DEMO_FAILURE_MODE changes; APPLICATIONINSIGHTS_CONNECTION_STRING,
  # PULSEMART_RELEASE, and PULSEMART_ENVIRONMENT are carried over unchanged
  # from the current baseline (see labctl/src/labctl/scenario.py
  # `_fault_env_vars`).
  env:
    DEMO_FAILURE_MODE: checkout-500
  # Prefix for the immutable revision suffix labctl creates. A fresh epoch
  # suffix on every `labctl demo trigger` keeps repeat runs idempotent
  # without colliding with a still-existing prior fault revision (Container
  # Apps revisions are immutable and never reused). The combined container
  # app name + "--" + suffix must fit Azure's real 54-character revision-name
  # limit (see labctl/src/labctl/scenario.py `_fault_revision_suffix`),
  # which is shorter than the revision-suffix argument's own 63-character
  # limit documented in isolation.
  revision_suffix_prefix: fault

alert:
  # Falls back to the Terraform-managed metric alert name from
  # infra/modules/alerting (`workload_context.metric_alert_name`) when this
  # entry is not overridden; kept explicit here for operator visibility.
  name: alert-pulsemart-checkout-5xx
  # Azure Monitor evaluates this rule every PT1M over a trailing PT5M window
  # (see infra/modules/alerting/variables.tf). The rule can only fire on an
  # evaluation boundary, so the honest expected range is 1-6 minutes after
  # the failure threshold is crossed, not a single fixed number.
  expected_time_to_fire_minutes: [1, 6]
  # Bounded overall deadline `labctl demo trigger` polls the real
  # Microsoft.AlertsManagement alert instance for before reporting a timeout
  # (still a WARN, not a hard failure: the checkout failures themselves are
  # the load-bearing proof that the fault is live).
  max_wait_seconds: 480
  poll_interval_seconds: 15

load:
  # Synthetic POST /api/checkout traffic `labctl demo trigger` drives against
  # the fault revision. Sized well above the metric alert's
  # `alert_threshold_5xx` (default 3; see config.local.toml [workload]) so a
  # slow individual request or two never leaves the real count under
  # threshold.
  request_count: 40
  concurrency: 4
  request_timeout_seconds: 15
  # Minimum observed HTTP 5xx responses required to trust that the real
  # Azure Monitor alert has enough signal to fire; below this, `demo trigger`
  # exits nonzero rather than waiting on an alert that cannot legitimately
  # fire yet.
  min_failures_required: 6

checks:
  # Descriptive only (surfaced by `labctl demo list`/the presenter runbook);
  # the executable checks live in labctl/src/labctl/scenario.py
  # `evaluate_fault_checks`/`evaluate_recovery_checks` and are exercised by
  # `labctl demo verify`.
  fault_active:
    - checkout_returns_500
    - traffic_on_fault_revision
    - alert_fired_or_recent
  recovered:
    - checkout_canary_batch
    - traffic_on_baseline_revision
    - rollback_timestamp_observed
    - failure_rate_below_threshold
    - alert_not_firing

incident:
  # Must match agent/automations/incident-filters/checkout-5xx.yaml.
  response_plan: checkout-5xx
  handling_subagent: incident-investigator
  title_contains: checkout
  severity: Sev2
