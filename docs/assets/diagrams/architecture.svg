<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img"
     aria-labelledby="arch-title arch-desc" class="architecture-diagram">
  <title id="arch-title">Azure SRE Agent demonstration architecture</title>
  <desc id="arch-desc">
    The presenter drives labctl, a Python CLI, which applies Terraform to two
    resource groups, runs an ACR cloud build, and calls the Azure SRE Agent
    data plane. The agent resource group contains the Microsoft.App/agents
    resource, its managed identities, and its own Application Insights and
    Log Analytics. The workload resource group contains the Azure Container
    Registry, the PulseMart Container App, its Log Analytics workspace, its
    Application Insights instance, and the checkout failure alert. The
    Container Registry supplies images to the Container App, which sends
    telemetry to its Log Analytics workspace and Application Insights
    instance. Application Insights feeds the alert, the alert reaches the
    agent through the Azure Monitor incident platform, and the agent reads
    Application Insights, Log Analytics, and the Container App, and connects
    to the GitHub repository for source context, to investigate and, once a
    human approves, to remediate.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line, #484644)"></path>
    </marker>
  </defs>

  <style>
    .architecture-diagram { font-family: var(--font-sans, "Segoe UI", system-ui, sans-serif); }
    .architecture-diagram text { fill: var(--diagram-text, #201f1e); }
    .architecture-diagram .lane-label { fill: var(--diagram-muted, #484644); font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .architecture-diagram .node-title { font-size: 15px; font-weight: 700; }
    .architecture-diagram .node-sub { font-size: 12.5px; fill: var(--diagram-muted, #484644); }
    .architecture-diagram .box { fill: var(--diagram-surface, #f3f2f1); stroke: var(--diagram-border, #8a8886); stroke-width: 1.5; rx: 10; }
    .architecture-diagram .box--group { fill: none; stroke: var(--diagram-border, #8a8886); stroke-width: 1.5; stroke-dasharray: 6 5; rx: 14; }
    .architecture-diagram .box--accent { stroke: var(--diagram-accent, #0078d4); stroke-width: 2; }
    .architecture-diagram .edge { fill: none; stroke: var(--diagram-line, #484644); stroke-width: 1.6; marker-end: url(#arrow); }
    .architecture-diagram .edge--accent { stroke: var(--diagram-accent, #0078d4); stroke-width: 2; marker-end: url(#arrow); }
  </style>

  <!-- Presenter and labctl -->
