metadata:
  name: daily-reliability-summary
spec:
  description: >-
    Daily reliability summary for the PulseMart demo workload
    (rg-sre-agent-workload-demo): incidents, fired alerts, and checkout
    health over the last 24 hours.
  schedule: 0 8 * * *
  prompt: >-
    Summarize the last 24 hours of incidents, fired alerts (especially
    alert-pulsemart-containerapp-5xx), and PulseMart checkout health
    (ca-pulsemart-demo) in resource group rg-sre-agent-workload-demo. Flag
    any Container App revision or configuration change that needs
    attention, and note whether any incident is still open.
  enabled: true
  mode: Review
