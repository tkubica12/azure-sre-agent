[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "labctl"
version = "0.1.0"
description = "Operator CLI for the Azure SRE Agent demonstration lifecycle."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
labctl = "labctl.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/labctl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["labctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
